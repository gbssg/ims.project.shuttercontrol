<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steuerung</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Jalousien Steuerung</h1>
        <img src="../docs/img/logo.png" alt="IMS-T Logo">
    </header>
    <div class="shutters">
        <div class="shutter">
            <h2>Jalousie L</h2>
            <div class="buttons">
                <button id="up_button" class="up-button">Up</button>
                <button id="down_button" class="down-button">Down</button>
                <button id="stop_button" class="stop-button">Stop</button>
            </div>
            <div class="slider_with_value">
                <input type="range" class="time-slider" min="0" max="45000" value="0" id="slider-1">
                <span id="slider-output-1" class="slider_out">auto</span>
            </div>
        </div>
        <div class="shutter">
            <h2>Jalousie R</h2>
            <div class="buttons">
                <button id="up_button_2" class="up-button">Up</button>
                <button id="down_button_2" class="down-button">Down</button>
                <button id="stop_button_2" class="stop-button">Stop</button>
            </div>
            <div class="slider_with_value">
                <input type="range" class="time-slider" min="0" max="45000" value="0" id="slider-2">
                <span id="slider-output-2" class="slider_out">auto</span>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
